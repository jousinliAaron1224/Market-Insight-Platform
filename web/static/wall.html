<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情報牆</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav id="nav"></nav>
<main class="wrap">
  <header class="hero">
    <div class="eyebrow">資料來源 · 01</div>
    <h1>情報牆</h1>
  </header>

  <section class="list" style="margin-top:24px">
    <div class="listhead">
      <span><b>本週要注意</b>　<span id="weekrange" style="opacity:.85"></span></span>
      <span class="right"><span id="weeksum" class="small" style="opacity:.9"></span>
        <select id="days" style="padding:4px 8px"><option value="7">最近 7 天</option><option value="14">最近 14 天</option><option value="30">最近 30 天</option></select></span>
    </div>
    <div id="week"><div class="row-empty">載入中…</div></div>
  </section>

  <div class="subnav" style="margin-top:34px;justify-content:flex-start">
    <button type="button" class="tab" data-tab="law">法規動態</button>
    <button type="button" class="tab" data-tab="news">新聞動態</button>
  </div>
  <form id="f" onsubmit="return false">
    <div class="searchbar">
      <label>標題關鍵字<input type="search" name="q" placeholder="搜尋標題，例如：投資型、外幣、撥回"></label>
      <button type="button" class="go" id="goq" aria-label="搜尋"></button>
    </div>
    <div class="chips">
      <span class="fchip"><span class="k">影響程度</span>
        <label><input type="checkbox" name="imp" value="high" checked>高</label>
        <label><input type="checkbox" name="imp" value="medium" checked>中</label>
        <label><input type="checkbox" name="imp" value="low">低</label></span>
      <label class="fchip" id="c-cat"><span class="k">類別</span><select name="category"><option value="">全部</option></select></label>
      <label class="fchip" id="c-src"><span class="k">來源</span><select name="source"><option value="">全部</option></select></label>
      <span class="fchip" id="c-date"><input type="date" name="from" aria-label="開始日期"> ～ <input type="date" name="to" aria-label="結束日期"></span>
      <label class="fchip"><input type="checkbox" name="only_self">只看影響自家商品的</label>
      <label class="fchip"><input type="checkbox" name="hidden">顯示預設隱藏</label>
      <button type="button" class="reset" id="reset">清除條件</button>
    </div>
  </form>
  <section class="list" style="margin-top:18px">
    <div class="listhead"><span id="count">載入中…</span></div>
    <div id="list"></div>
  </section>
</main>

<script src="/common.js"></script>
<script>
const form = document.getElementById("f");
let meta = {}, tab = "law";
const GROUP_SOURCES = { law: ["tii_law_rss", "fsc_press", "fsc_penalty"], news: ["news_rss"] };

function compareLink(company, name, art) {
  const h = new URLSearchParams({ sel: `${company}|${name}` });
  if (art) h.set("art", art);
  return `/compare.html#${h.toString()}`;
}

// 一筆情報：卡片列（標題＋chip／對現有商品的影響／原文）
function itemHTML(it) {
  const pi = it.product_impact || {};
  const extra = Object.entries(it.extra || {}).map(([k, v]) => {
    const zh = { unit: "發布單位", respondent: "受處分人", fine_twd: "罰鍰（元）", data_type: "資料類別", feed: "新聞來源", doc_no: "發文字號" }[k] || k;
    return `<span>${zh} ${esc(k === "fine_twd" ? Number(v).toLocaleString() : v)}</span>`;
  }).join("");
  return `<div class="row stripe-${it.impact}${it.hidden ? " hidden-item" : ""}">
    <div>
      <a class="row-title" style="font-size:16.5px" href="${esc(it.url)}" target="_blank" rel="noopener" title="${esc(extra.replace(/<[^>]+>/g, " "))}">${esc(it.title)}</a>
      <div class="row-meta">
        <span class="tag imp-${it.impact}">${IMPACT_ZH[it.impact]}影響</span>
        <span class="chip">${icon("calendar")}${esc(it.date)}</span>
        <span class="chip blue">${icon("building")}${esc(it.source)}</span>
        ${it.categories.slice(0, 2).map(c => `<span class="tag">${esc(c)}</span>`).join("")}
      </div>
    </div>
    <div class="row-side">
      <div>${pi.summary ? esc(pi.summary) : '<span class="muted">對現有商品沒有直接影響</span>'}</div>
      <details data-id="${it.raw_doc_id}"><summary>細節</summary><div class="detail-box">載入中…</div></details>
    </div>
    <div class="row-act">${it.raw ? `<a class="btn soft tiny" href="${esc(it.raw)}" target="_blank">原文存檔</a>` : ""}</div>
  </div>`;
}

function tableHTML(items, empty) {
  if (!items.length) return `<div class="row-empty">${empty}</div>`;
  return items.map(itemHTML).join("");
}

// 展開「細節」時才載入受影響商品清單
document.addEventListener("toggle", async e => {
  const d = e.target;
  if (!(d instanceof HTMLDetailsElement) || !d.open || !d.dataset.id || d.dataset.loaded) return;
  d.dataset.loaded = "1";
  const it = await getJSON("/api/impact?raw_doc_id=" + d.dataset.id);
  const pi = it.product_impact;
  const art = (pi.articles || [])[0];
  const self = pi.self_products || [];
  const comp = Object.entries(pi.competitors || {}).map(([c, n]) => `${esc(c)} ${n}`).join("、");
  d.querySelector(".detail-box").innerHTML = `
    <div><b>判定理由</b><ul class="reasons">${it.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>
    ${pi.reasons.length ? `<div><b>對應商品的依據</b>：${esc(pi.reasons.join("、"))}（${esc(pi.scope)}）</div>` : ""}
    ${pi.untracked.length ? `<div><b>影響的商品線</b>：${esc(pi.untracked.join("、"))}（目前未收錄，M3 只有投資型）</div>` : ""}
    ${pi.company_level.length ? `<div><b>公司層級</b>：${esc(pi.company_level.join("、"))}</div>` : ""}
    ${pi.articles.length ? `<div><b>建議檢視條文</b>：${esc(pi.articles.join("、"))}</div>` : ""}
    ${self.length ? `<div><b>自家受影響商品 ${self.length} 個</b>：${esc(Object.entries(pi.self_lines || {}).map(([l, n]) => `${l} ${n}`).join("、"))}
        <details><summary>列出商品（點商品名稱到競品比較）</summary>
        <div class="namegrid">${self.map(n => `<a href="${compareLink(pi.self_company, n, art)}" target="_blank">${esc(n.replace(pi.self_company, ""))}</a>`).join("")}</div>
        </details></div>` : ""}
    ${comp ? `<div><b>競品受影響商品數</b>：${comp}</div>` : ""}
    ${it.raw ? `<div><a href="${esc(it.raw)}" target="_blank">抓取時的原文存檔</a></div>` : ""}`;
}, true);

// ---------------- 本週要注意 ----------------
async function loadWeek() {
  const days = document.getElementById("days").value;
  const w = await getJSON("/api/week?days=" + days);
  if (!w.as_of) { document.getElementById("week").innerHTML = '<p class="muted">沒有資料</p>'; return; }
  document.getElementById("weekrange").textContent = `${w.from} ～ ${w.as_of}（以資料最新日期為準）`;
  const c = w.counts;
  document.getElementById("weeksum").innerHTML =
    `法規 ${c.law.total}（高 ${c.law.high}）・新聞 ${c.news.total}（高 ${c.news.high}）・商品動態 ${w.product_events.length}`;
  const evZh = { product_launched: "上架", product_discontinued: "停售", doc_revised: "條款改版" };
  const evTag = { product_launched: "green", product_discontinued: "red", doc_revised: "blue" };
  const pev = w.product_events.map(p => `<div class="row">
      <div><a class="row-title" style="font-size:16.5px" href="${compareLink(p.company, p.title)}" target="_blank">${esc(p.title)}</a>
        <div class="row-meta"><span class="tag ${p.source_corrected ? "amber" : evTag[p.type]}">${p.source_corrected ? "條款來源更正" : evZh[p.type]}</span>
          <span class="chip">${icon("calendar")}${esc(p.date)}</span><span class="chip blue">${icon("building")}${esc(p.company || "")}</span>
          ${p.reconstructed ? '<span class="tag line">重建時間線</span>' : ""}</div></div>
      <div class="row-side"><span class="small muted">商品動態</span></div><div></div></div>`).join("");
  document.getElementById("week").innerHTML =
    tableHTML(w.focus, `這段期間沒有高影響或影響${esc(w.self_company || "自家")}商品的項目`) + pev;
}

// ---------------- 法規動態／新聞動態 ----------------
function params() {
  const fd = new FormData(form);
  return {
    group: tab, impact: fd.getAll("imp").join(","),
    category: fd.get("category"), source: fd.get("source"),
    from: fd.get("from"), to: fd.get("to"), q: (fd.get("q") || "").trim(),
    hidden: fd.get("hidden") ? "all" : "0",
  };
}

async function loadList() {
  const data = await getJSON("/api/labels?" + qs(params()));
  let items = data.items;
  if (form.only_self.checked) items = items.filter(i => i.product_impact.self_count > 0);
  document.getElementById("count").textContent = `${tab === "news" ? "新聞動態" : "法規動態"}：共 ${items.length} 筆`;
  const empty = tab === "news"
    ? "目前沒有新聞。在 Mac 執行 python -m scheduler.run news_rss 抓取。"
    : "沒有符合條件的項目";
  const PAGE = 15;
  const draw = n => {
    document.getElementById("list").innerHTML = tableHTML(items.slice(0, n), empty)
      + (items.length > n ? `<div style="padding:14px"><button type="button" class="more-btn" id="more">顯示更多（還有 ${items.length - n} 筆）</button></div>` : "");
    const m = document.getElementById("more");
    if (m) m.onclick = () => draw(n + PAGE);
  };
  draw(PAGE);
}

function setTab(t) {
  tab = t;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  form.source.innerHTML = option("", "全部") + GROUP_SOURCES[t].map(s => option(s, meta.source_labels[s] || s)).join("");
  history.replaceState(null, "", "#" + new URLSearchParams({ tab: t, days: document.getElementById("days").value }));
  loadList();
}

(async () => {
  meta = await renderNav("wall");
  form.category.insertAdjacentHTML("beforeend", (meta.categories || []).map(c => option(c, c)).join(""));
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("days")) document.getElementById("days").value = h.get("days");
  document.getElementById("days").onchange = () => { loadWeek(); history.replaceState(null, "", "#" + new URLSearchParams({ tab, days: document.getElementById("days").value })); };
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
  document.getElementById("goq").innerHTML = icon("search") + "<span>搜尋</span>";
  document.getElementById("goq").onclick = loadList;
  form.addEventListener("change", loadList);
  form.q.addEventListener("input", () => { clearTimeout(form._t); form._t = setTimeout(loadList, 250); });
  document.getElementById("reset").onclick = () => { form.reset(); loadList(); };
  loadWeek();
  setTab(h.get("tab") === "news" ? "news" : "law");
})();
</script>
</body>
</html>
