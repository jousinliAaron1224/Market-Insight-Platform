<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品規格書</title>
<link rel="stylesheet" href="/style.css">
<style>
  .spec-tbl th { width: 34%; background: transparent; color: var(--ink2); font-weight: 500; white-space: normal; }
  .spec-tbl td.cmp { color: var(--ink2); font-size: 12.5px; width: 38%; }
  .spec-tbl td { font-size: 14px; }
  .spec-tbl .empty { color: var(--bad); }
  .spec ul { margin: 4px 0; padding-left: 20px; font-size: 13.5px; }
  .spec .sect-b .sub { font-size: 13px; font-weight: 650; margin: 12px 0 2px; color: var(--ink2); }
  .disclaimer { font-size: 12.5px; color: var(--ink2); background: #fffbf0; border: 1px solid #f2e3b5; padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 16px; }
  @media print {
    nav, .page-actions { display: none !important; }
    body { background: #fff; }
    .detail { border: 0; box-shadow: none; grid-template-columns: 220px 1fr; }
    .sect { break-inside: avoid; }
    a { color: inherit; }
  }
</style>
</head>
<body>
<nav id="nav"></nav>
<main class="wrap spec">
  <header class="page-h">
    <div><div class="eyebrow">商品規格書</div><h1 id="title">商品規格書</h1><div class="sub" id="sub"></div></div>
    <div class="page-actions"><a id="back" class="btn">← 回工作台</a><button onclick="print()" class="primary" type="button">列印／存成 PDF</button></div>
  </header>
  <div class="detail">
    <aside class="detail-side" id="side"></aside>
    <div class="detail-main" id="spec"><p class="muted">載入中…</p></div>
  </div>
</main>
<script src="/common.js"></script>
<script>
const LEVEL_ZH = { missing: "未填", warn: "要確認", info: "提醒" };
const KIND_ZH = { product: "競品", article: "條文", reg: "法規", law: "法規動態", news: "新聞", market: "市場" };
const fmtVal = v => v === true ? "是" : v === false ? "否" : Array.isArray(v) ? (v.length ? v.join("、") : null) : (v === "" ? null : v);
function cmpText(s) {
  if (!s || s.kind === "none") return '<span class="muted">競品擷取不到</span>';
  if (s.kind === "range") return `${num(s.min, 1)}～${num(s.max, 1)}，中位數 ${num(s.median, 1)}（${s.n} 個）`;
  return s.counts.slice(0, 5).map(([k, n]) => `${esc(k.replace(/（.*）$/, ""))} ${n}`).join("、") + `（共 ${s.n} 個）`;
}
const MOD_ICON = { positioning: "target", underwriting: "user", benefits: "shield", investment: "trend", fees: "coins",
                   rights: "file", exclusions: "alert", sales: "scale", filing: "calendar" };
const metaItem = (ic, k, v, dim) => `<div class="meta-item">${icon(ic)}<div>${k ? `<div class="k">${esc(k)}</div>` : ""}<div class="v${dim ? " dim" : ""}">${v}</div></div></div>`;
(async () => {
  await renderNav("lab");
  const id = new URLSearchParams(location.search).get("id");
  document.getElementById("back").href = `/#id=${id}`;
  const d = await getJSON(`/api/lab/spec?id=${id}`);
  document.title = `${d.draft.name}｜商品規格書`;
  document.getElementById("title").textContent = d.draft.name;
  document.getElementById("sub").textContent = "由商品工作台自動彙整，可列印或存成 PDF";
  const checks = d.checks;
  const cnt = l => checks.filter(c => c.level === l).length;
  const f = Object.fromEntries(d.modules.flatMap(m => m.fields.map(x => [x.id, x.value])));
  const total = d.modules.reduce((a, m) => a + m.fields.length, 0);
  const done = d.modules.reduce((a, m) => a + m.fields.filter(x => fmtVal(x.value) != null).length, 0);
  document.getElementById("side").innerHTML =
    metaItem("hash", "草案編號", esc(d.draft.id))
    + metaItem("layers", "險種", esc(d.line || "未定"), !d.line)
    + metaItem("coins", "計價幣別", esc(fmtVal(f.currency) || "未定"), !fmtVal(f.currency))
    + metaItem("building", "銷售通路", esc(fmtVal(f.channel) || "未定"), !fmtVal(f.channel))
    + metaItem("check", "已填欄位", `${done} / ${total}`)
    + metaItem("alert", "檢查事項", `<span class="tag red">要確認 ${cnt("warn")}</span> <span class="tag amber">未填 ${cnt("missing")}</span> <span class="tag">提醒 ${cnt("info")}</span>`)
    + metaItem("grid", "同險種競品", `${d.n_competitors} 個商品`)
    + (d.draft.base ? metaItem("link", "複製自", esc(d.draft.base.replace("|", "｜"))) : "")
    + metaItem("calendar", "建立／最後修改", `${esc((d.draft.created_at || "").slice(0, 10))}<br><span class="small muted">${esc((d.draft.updated_at || "").slice(0, 16).replace("T", " "))} UTC</span>`);
  let h = `<p class="disclaimer">競品數字為自動擷取，法規待法遵核對；本文件不是法律意見。</p>`;
  d.modules.forEach((m, i) => {
    const c = checks.filter(x => x.module === m.id);
    h += `<section class="sect"><div class="sect-h">${icon(MOD_ICON[m.id] || "file")}${i + 1}. ${esc(m.name)}
        <span class="right">${m.fields.filter(x => fmtVal(x.value) != null).length}/${m.fields.length} 已填</span></div>
      <div class="sect-b">
      <table class="spec-tbl"><thead><tr><th>項目</th><th>設定</th><th>同險種競品</th></tr></thead><tbody>
      ${m.fields.map(fd => { const v = fmtVal(fd.value); return `<tr><th>${esc(fd.label)}</th>
        <td>${v == null ? '<span class="empty">未填</span>' : esc(v)}</td><td class="cmp">${fd.competitors ? cmpText(fd.competitors) : ""}</td></tr>`; }).join("")}
      </tbody></table>
      ${m.note ? `<div class="sub">備註</div><p style="margin:2px 0">${esc(m.note)}</p>` : ""}
      ${c.length ? `<div class="sub">要確認的事項</div><div class="checks-box" style="margin-top:4px">${c.map(x => `<div class="chk chk-${x.level}"><span class="chk-tag">${LEVEL_ZH[x.level]}</span>
          <span>${esc(x.msg)}${x.ref ? `<span class="src">依據：${esc(x.ref)}</span>` : ""}</span></div>`).join("")}</div>` : ""}
      <div class="sub">相關法規</div><ul>${m.regs.map(r => `<li>${esc(r.name)}<span class="muted">：${esc(r.note || "")}</span></li>`).join("")}</ul>
      ${m.refs.length ? `<div class="sub">參考資料</div><ul>${m.refs.map(r => `<li><span class="pin-kind">${esc(KIND_ZH[r.kind] || r.kind)}</span> ${r.url ? `<a href="${esc(r.url)}">${esc(r.title)}</a>` : esc(r.title)}${r.note ? `<span class="muted">（${esc(r.note)}）</span>` : ""}</li>`).join("")}</ul>` : ""}
      </div></section>`;
  });
  document.getElementById("spec").innerHTML = h;
})();
</script>
</body>
</html>
