# 所有來源設定集中於此，不寫死在程式碼（Handbook「排程、限速與事件觸發」）
defaults:
  per_domain_concurrency: 1
  min_interval_sec: 3
  user_agent: "InsuranceIntelBot/0.1 (hackathon; contact: jousinli1224@gmail.com)"
  retry: { max: 3, backoff_sec: [30, 120, 600] }   # 只重試網路錯誤、429、5xx；4xx 與解析錯誤不重試
  respect_robots: true
  timezone: Asia/Taipei        # cron 排程以台北時間解讀（D18）
  health_zero_runs: 3          # 連續幾輪 0 筆發警示
  health_missing_ratio: 0.3    # 解析不到必要欄位的比例超過此值發警示
  db_path: data/intel.db
  raw_root: data/raw

# M4 解析層（D22）：事件 → 條款結構化／新聞分類／商品狀態。先純規則，LLM 介面預留
parsing:
  schedule: "*/10 * * * *"     # --serve 時每 10 分鐘消化一次未處理事件
  llm: none                    # 之後接 LLM：填 module:Class（parsers.base.Enricher 的子類別）
  max_attempts: 3              # 同一事件解析失敗 3 次 → 標 failed 並發警示
  batch: 200
  classify_sources: [tii_law_rss, fsc_press, fsc_penalty, news_rss]
  # 分類規則（D23）：標題命中 1 個、或內文命中 2 個不同關鍵字即標該類別；可多類別
  classify:
    categories:
      商品: [保險商品, 商品, 示範條款, '(?<!非)投資型', 變額, '(?<![上下半今去明前每全])年金', 利率變動型, 萬能, 外幣保險, 外幣收付, 保單, 附加條款, 參考條款, 停售, 新商品, 上市]
      利率: [利率, 宣告利率, 預定利率, 準備金利率, 殖利率, 升息, 降息, 利差]
      法規: [辦法, 規則, 準則, 注意事項, 解釋令, 自律規範, 規範, 範本, 修正, 草案, 預告, 實施, 管理辦法, 法令, 令, 裁罰, 罰鍰, 核處, 清償能力]
      通路: [保險代理人, 保險經紀人, 銀行保險, 業務員, 招攬, 通路, 行動服務, 電子商務, 網路投保, 合作推廣, 銷售, 理財專員, 保經, 保代]
      人事: [一職, 調任, 調陞, 接任, 新任, 董事長, 總經理, 主任秘書, 處長, 人事異動, 卸任]
    # 影響程度（D23）：高＝Cardif 主力險種／通路的法規、利率、商品；壽險同業裁罰；資本制度；提到法巴
    focus: ['(?<!非)投資型', 變額, '(?<![上下半今去明前每全])年金', 利率變動型, 利變, 外幣保險, 外幣收付, 銀行保險, 準備金利率]
    capital: [清償能力, ICS, IFRS 17, IFRS17, 自有資本, 風險資本, 資本適足]
    self_names: [法國巴黎, 法巴, Cardif, 巴黎人壽]
    life: [人身保險, 人壽, 壽險, '(?<![上下半今去明前每全])年金', 投資型, 健康保險, 傷害保險]
    property_only: [財產保險, 產物保險, 產險, 汽車, 機車, 地震, 住宅火災, 旅行不便, 登山, 巨災, 延誤保險, 水上, 車險, 火災]
  # 法規／新聞 → 對現有商品的影響（D27，規則式、只比對標題，每筆附理由）
  # scope: all ＝ 全部銷售中的投資型商品；line／currency 是收斂條件（同類取聯集、不同類取交集）
  # untracked ＝ 影響的商品線目前沒收錄（M3 只有投資型）；company_level ＝ 公司層級事項，不對應個別商品
  product_impact:
    self_company: 法商法國巴黎人壽
    no_product_sources: [fsc_penalty]        # 裁罰案只提示公司層級，不對應商品
    exclude: [非投資型, 財產保險, 產物保險, 強制汽車, 機車, 地震, 旅行不便, 巨災, 再保險, 勞保, 國民年金, 勞退, 年金改革, 章程]
    exclude_unless: [人身保險]               # 例如「財產保險業…及人身保險業辦理資訊公開…」仍要對應
    rules:
      - {match: '(?<!非)投資型|變額|專設帳簿|投資標的', scope: all, reason: 投資型商品規範}
      - {match: '銀行保險|保險代理人|保險經紀人|招攬|銷售|行動服務|電子商務|業務員', scope: all, reason: 通路／銷售相關}
      - {match: '人身保險業辦理資訊公開', scope: all, reason: 資訊公開規範}
      - {match: '(?<![上下半今去明前每全])年金', line: [變額年金保險], reason: 年金型}
      - {match: '萬能', line: [變額萬能壽險], reason: 萬能型}
      - {match: '投資型人壽保險單示範條款', line: [變額壽險, 變額萬能壽險], reason: 投資型壽險示範條款}
      - {match: '外幣(?!收付非投資型)', currency: foreign, reason: 外幣商品}
      - {match: '利率變動型|利變', untracked: 利率變動型商品}
      - {match: '外幣收付非投資型', untracked: 外幣非投資型商品}
      - {match: '準備金利率', untracked: 傳統型與利率變動型新契約（責任準備金利率）}
      - {match: '清償能力|自有資本|風險資本|ICS|IFRS', company_level: 資本與清償能力}
      - {match: '裁罰|罰鍰|核處', company_level: 同業裁罰：檢視自家同類作業}
    articles:                                 # 標題關鍵字 → 建議檢視的條文（示範條款標題）
      示範條款: [保險範圍, 名詞定義, 除外責任, 契約的終止及其限制]
      投資標的: [投資標的及配置比例約定, 投資標的之新增、關閉與終止, 投資標的轉換]
      收益分配|撥回: ['投資標的之收益分配或提減(撥回)投資資產']
      匯率|外幣(?!收付非投資型): [貨幣單位與匯率計算]
      解約|終止: [契約的終止及其限制]
      撤銷: [契約撤銷權]
      保單借款|保險單借款: [保險單借款及契約效力的停止]

sources:
  - id: tii_law_rss
    tier: A
    schedule: "0 */2 * * *"
    adapter: adapters.tii_law_rss:TiiLawRssAdapter
    domain: law.tii.org.tw
    feed_url: https://law.tii.org.tw/Fn/rss.asp
    fetch_detail: true          # RSS item + 內文頁 ShowNews.asp 都存 raw
    # 決策 2026-10-02（Chris）：law.tii.org.tw 的 robots.txt 為 "Disallow: /"，
    # 但開放資料 API（openapi.tii.org.tw K101）落後約 2 個月且無內文，
    # 故此來源例外不檢查 robots；以每網域 1 並發、間隔 >= 3 秒低頻抓取。
    respect_robots: false
    # law.tii.org.tw 的 TLS 憑證鏈在 Python 下驗證失敗（unable to get local issuer certificate）。
    # 以 scripts/fetch_issuer_cert.sh 取得簽發者憑證，放這裡補進信任清單；不關閉驗證。
    extra_ca_files: [config/certs/law.tii.org.tw.pem]

  - id: fsc_press
    tier: B
    schedule: "15 */4 * * *"
    adapter: adapters.fsc_press:FscPressAdapter
    domain: www.fsc.gov.tw
    # www.fsc.gov.tw 的憑證缺 Subject Key Identifier，Python 3.13+ 嚴格模式會拒絕；
    # 只關這項格式檢查，憑證鏈與主機名稱仍驗證（D15）
    x509_strict: false
    list_pages: 3               # 每頁 15 筆；3 頁約一個月份
    # 只抓這些單位的內文；其他單位（銀行局、證期局…）只記列表列（D12）
    detail_units: [保險局, 金融監督管理委員會, 檢查局]

  - id: fsc_penalty            # 裁罰案件 RSS（D14，Handbook 原未列）
    tier: A
    schedule: "40 */2 * * *"
    adapter: adapters.fsc_penalty:FscPenaltyAdapter
    domain: www.fsc.gov.tw
    # www.fsc.gov.tw 的憑證缺 Subject Key Identifier，Python 3.13+ 嚴格模式會拒絕；
    # 只關這項格式檢查，憑證鏈與主機名稱仍驗證（D15）
    x509_strict: false
    feed_url: https://www.fsc.gov.tw/RSS/Messages?serno=201202290003&language=chinese
  # ---- M3 競品商品資料：投資型（D19–D21）。清單＝法定公開的「商品名稱、日期及文號」PDF ----
  - id: company_cardif_products  # 法巴人壽（自家基準）
    tier: C
    schedule: "30 3 * * *"
    adapter: adapters.companies.cardif:CardifProductsAdapter
    domain: life.cardif.com.tw
    product_list_page: https://life.cardif.com.tw/a5      # 清單網址含 uuid／時間戳，從此頁找最新連結
    product_list_link: "商品名稱與核准"
    product_list_url: https://life.cardif.com.tw/documents/418719/461728/VIE_Info_1.pdf/a7b1fe95-cfbb-4cec-a4dc-c618ff9ee336
    clause_index_url: https://life.cardif.com.tw/a59

  - id: company_cathay_products  # 國泰人壽
    tier: C
    schedule: "35 3 * * *"
    adapter: adapters.companies.cathay:CathayProductsAdapter
    domain: www.cathaylife.com.tw
    x509_strict: false           # 憑證缺 Subject Key Identifier（D15）
    product_list_url: https://www.cathaylife.com.tw/official/content/dam/cathaylife-official/files/laws-policies/public-info/insurance/product/Investment.pdf
    clause_index_url: https://www.cathaylife.com.tw/official/laws-policies/public-info/info-insurance

  - id: company_fubon_products   # 富邦人壽
    tier: C
    schedule: "40 3 * * *"
    adapter: adapters.companies.fubon:FubonProductsAdapter
    domain: www.fubon.com
    x509_strict: false
    product_list_page: https://www.fubon.com/life/Investors/public-info/fubon/D3B4A1896E0046EB844E43A98E2FC83B/
    product_list_link: "商品之名稱、日期及文號"
    product_list_url: https://www.fubon.com/life/cms/B57613402C4F4DDAB6AF8CAB547399A5/2026-09/202609211516302819701100.pdf
    clause_index_url: https://www.fubon.com/life/Investors/public-info/fubon/D3B4A1896E0046EB844E43A98E2FC83B/

  - id: company_taiwanlife_products  # 台灣人壽
    tier: C
    schedule: "45 3 * * *"
    adapter: adapters.companies.taiwanlife:TaiwanLifeProductsAdapter
    domain: www.taiwanlife.com
    x509_strict: false
    product_list_url: https://www.taiwanlife.com/portal-api/File/10904   # 檔案編號若改變需手動更新
    clause_index_url: https://www.taiwanlife.com/portal-api/File/1792

  - id: company_kgi_products     # 凱基人壽
    tier: C
    schedule: "50 3 * * *"
    adapter: adapters.companies.kgi:KgiProductsAdapter
    domain: www.kgilife.com.tw
    x509_strict: false
    product_list_url: https://www.kgilife.com.tw/zh-tw/-/media/files/kgil/footer/corp/publicinfo/piinsurance-products/date_ilp.pdf
    clause_index_url: https://www.kgilife.com.tw/zh-tw/footer/corp/publicinfo/piinsurance-products/202412-insurance-products-clause

  - id: open_data              # 市場數據的需求面與市占率（D28）：政府資料開放平臺的統計資料集
    tier: A
    schedule: "20 6 * * 1"       # 月報資料，每週一檢查一次就夠
    adapter: adapters.open_data:OpenDataAdapter
    domain: data.gov.tw
    # 資料集的實際下載點不在 data.gov.tw：
    # - stat.fsc.gov.tw（14539）憑證缺 Subject Key Identifier → 只關格式嚴格檢查（D15）
    # - openapi.tii.org.tw（104113）沒送中繼憑證 → 補簽發者憑證（D7）：
    #   sh scripts/fetch_issuer_cert.sh openapi.tii.org.tw
    # 憑證鏈與主機名稱都照常驗證，不關 TLS 驗證。
    x509_strict: false
    extra_ca_files: [config/certs/openapi.tii.org.tw.pem]
    datasets:
      # 下載後確認的內容（2026-10-05）：
      - {id: 14539, name: lia_performance, purpose: demand_ref, note: 壽險業績統計（壽險公會）：只有一期初／續年度×投資型／傳統型，公告 2020-03-25}
      - {id: 104113, name: ib_premium_monthly, purpose: demand, note: 人身保險業保費收入（保發中心 I10）：全市場依險種、依月，無公司別}

  - id: news_rss               # D9／D10／D16
    tier: D
    schedule: "*/45 * * * *"
    adapter: adapters.news_rss:NewsRssAdapter
    domain: multiple             # 各 feed 依自己的網域限速
    feeds:
      - name: ctee_insurance     # 工商時報「保險脈動」，保險專版全收
        url: https://www.ctee.com.tw/rss_web/category/insurance
        keyword_filter: false
        # 2026-10-03 停用：網站前有 Cloudflare 機器人防護，程式請求一律 403（瀏覽器可開）。
        # 不以偽裝瀏覽器繞過；待取得許可或改用其他來源（D17）
        enabled: false
      - name: cna_finance        # 中央社財經；RSS 條款限非商業用途，正式上線需授權
        url: https://feeds.feedburner.com/rsscna/finance
        keyword_filter: true
      - name: ltn_business       # 自由時報財經（D26）；RSS 條款限非商業用途，黑客松 demo 可用，正式上線需授權
        url: https://news.ltn.com.tw/rss/business.xml   # 取自自由時報 RSS 服務頁，2026-10-05 尚未在 Mac 實跑確認
        keyword_filter: true
    keywords: [保險, 壽險, 產險, 保單, 保費, 金管會]
    # 公關稿規則（只比對標題，命中即標 pr_noise，不丟棄）
    pr_noise_patterns: ["勇奪", "榮獲", "奪.{0,12}獎", "獲.{0,20}獎", "獎項", "大獎", "評比",
                        "公益", "捐贈", "捐款", "志工", "路跑", "公開賽", "盃", "音樂會", "頒獎"]
    lead_ttl_days: 30            # RSS 導言只暫存 30 天（news_leads），raw 不含導言
    allow_empty_runs: true       # 關鍵字過濾後常為 0 筆，不套用「連續 0 筆」警示
